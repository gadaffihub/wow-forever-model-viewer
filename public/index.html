<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WoW models</title><meta name="viewer-version" content="{{APP_VERSION}}"><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body>
<svg class="svg-sprite" aria-hidden="true"><defs><symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></symbol><symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol><symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 1 5 M4 4v7h7"/></symbol><symbol id="icon-camera" viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/></symbol><symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></symbol><symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 4v16 M16 4v16"/></symbol><symbol id="icon-cube" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7Z M3 7l9 5 9-5 M12 12v10"/></symbol><symbol id="icon-paw" viewBox="0 0 24 24"><path d="M7 14c-1 1-3 3-2 5s3 1 7 1 6 1 7-1-1-4-2-5c-2-3-8-3-10 0Z"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><path d="M19.24,10.06L21.88,10.44L21.88,13.56L19.24,13.94L18.50,15.75L20.09,17.88L17.88,20.09L15.75,18.50L13.94,19.24L13.56,21.88L10.44,21.88L10.06,19.24L8.25,18.50L6.12,20.09L3.91,17.88L5.50,15.75L4.76,13.94L2.12,13.56L2.12,10.44L4.76,10.06L5.50,8.25L3.91,6.12L6.12,3.91L8.25,5.50L10.06,4.76L10.44,2.12L13.56,2.12L13.94,4.76L15.75,5.50L17.88,3.91L20.09,6.12L18.50,8.25Z"/><circle cx="12" cy="12" r="3"/></symbol></defs></svg>
<div class="workspace">
<aside class="library"><input id="search" type="search" placeholder="Search models…" aria-label="Search models"><div class="folder-controls"><nav id="folder-buttons" class="folder-buttons" aria-label="Model folders"><button data-root="creature/" class="active" aria-pressed="true">creature/</button><button data-root="character/" aria-pressed="false">character/</button><button data-root="item/" aria-pressed="false">item/</button><button data-root="models/" aria-pressed="false">models/</button></nav><button id="only-favorites" title="Favorites only" aria-label="Favorites only" aria-pressed="false"><svg aria-hidden="true"><use href="#icon-star"/></svg></button></div><div class="misc-selector"><button id="misc-button" aria-expanded="false" aria-controls="misc-menu">misc <span aria-hidden="true">▾</span></button><div id="misc-menu" aria-label="Misc folders" hidden></div></div><details id="subfolders"><summary>Subfolders</summary><nav id="folder-tree" aria-label="Subfolders"></nav></details><select id="table-filter" aria-label="Table references"><option value="all">All installed</option><option value="yes">In creature tables</option><option value="no">Not in creature tables</option></select><div class="sort-buttons" aria-label="Sort models"><button data-sort="folder" class="active" title="Sort by client folder">Folder ↑</button><button data-sort="name" title="Sort by name">Name ↑</button><button data-sort="id" title="Sort by file ID">File ID</button><button data-sort="skins" title="Sort by number of skins">Skins</button><button data-sort="size" title="Sort by file size">Size</button></div><div class="result-heading"><span id="result-count">Loading…</span></div><div id="results" class="results" aria-label="Models"></div></aside>
<main class="viewer"><div id="viewport" aria-label="Interactive 3D model viewport"></div><div class="model-toolbar"><span id="model-name"></span><div class="stage-actions"><button id="favorite" title="Favorite (F)" aria-label="Favorite model"><svg><use href="#icon-star"/></svg></button><button id="snapshot" title="Save PNG" aria-label="Save a screenshot"><svg><use href="#icon-camera"/></svg></button><button id="reset-camera" title="Reset view (0)" aria-label="Reset camera"><svg><use href="#icon-reset"/></svg></button></div></div><div id="stage-message" class="stage-message"><p>Opening installed beta…</p></div><div class="model-nav"><button id="prev-model" title="Previous model (←)" aria-label="Previous model">←</button><span id="position"></span><button id="next-model" title="Next model (→)" aria-label="Next model">→</button></div><div class="bottom-controls"><div class="animation-panel"><button id="play" title="Play or pause (Space)" aria-label="Play animation"><svg><use href="#icon-play"/></svg></button><select id="animation" aria-label="Animation"><option value="-1">No animation</option></select><select id="speed" aria-label="Playback speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><input hidden id="timeline" type="range" min="0" max="1" step="0.001" value="0"><span id="time-label" hidden></span></div><div class="view-controls"><label><input type="checkbox" id="wireframe"> Wireframe</label><label><input type="checkbox" id="rotate"> Rotate</label><button data-bg="#000000" class="bg-button selected">Black</button><button data-bg="#ffffff" class="bg-button">White</button></div><p id="animation-note" class="error-note"></p></div></main>
<aside class="inspector"><div class="inspector-tabs"><button data-panel="skins" class="active">Skins</button><button data-panel="info">Info</button><button id="settings-button" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel"><svg aria-hidden="true"><use href="#icon-settings"/></svg></button></div>
<section id="settings-panel" role="dialog" aria-labelledby="settings-title" hidden>
<div class="settings-heading"><strong id="settings-title">Settings</strong><button id="settings-close" aria-label="Close settings">×</button></div>
<label class="setting-check"><input id="autoplay-animations" type="checkbox">Autoplay animations</label>
<label class="setting-check"><input id="autoplay-sounds" type="checkbox">Autoplay sounds</label>
<label class="setting-check"><input id="cycle-skins" type="checkbox">Cycle skins automatically</label>
<label class="setting-row" for="skin-interval">Seconds per skin <input id="skin-interval" type="number" min="1" max="60" step="1" value="5"></label>
<label class="setting-label" for="startup-folder">Startup folder</label><select id="startup-folder"></select><button id="use-current-folder" class="settings-action">Use current folder</button>
<div class="setting-label">WoW installation</div><p id="installation-path" class="settings-path"></p><button id="choose-installation" class="settings-action" hidden>Choose folder…</button>
<form id="installation-form" hidden><input id="installation-input" type="text" aria-label="WoW installation path" placeholder="/path/to/World of Warcraft" required><button type="submit" class="settings-action">Save installation path</button></form>
<p id="settings-status" role="status"></p>
</section><div id="skins-panel"><div class="skin-heading"><span>Skins</span><span id="appearance-count">0</span><button id="skin-prev" title="Previous skin (Shift+←)" aria-label="Previous skin">‹</button><button id="skin-next" title="Next skin (Shift+→)" aria-label="Next skin">›</button></div><div id="appearances" class="appearances"></div><p id="model-warnings" class="error-note"></p></div><div id="info-panel" hidden><div id="model-info"></div></div></aside></div><div class="toast" id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
